<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - BrillaClean</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-principal: #0F3B34;
            --color-secundario: #A4977E;
            --color-fondo: #F8F7F4;
            --fuente-principal: 'Poppins', sans-serif;
        }
        body {
            font-family: var(--fuente-principal);
            background-color: var(--color-fondo);
            margin: 0;
            padding: 0;
            color: #333;
        }
        .hidden { display: none !important; }

        /* Estilo Login */
        #loginModalContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--color-principal), #09231f);
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-card h2 { color: var(--color-principal); margin-bottom: 20px; }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            background-color: var(--color-principal);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-card a {
            display: inline-block;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        /* Estilo Panel de Control */
        .admin-header {
            background-color: var(--color-principal);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h1 { margin: 0; font-size: 1.5rem; }
        .btn-logout {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .admin-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .table-responsive {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            overflow-x: auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        th { color: var(--color-principal); font-weight: 700; }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #fff3cd;
            color: #856404;
        }
        .badge.Confirmado { background-color: #d4edda; color: #155724; }
        .badge.Rechazado { background-color: #f8d7da; color: #721c24; }
        
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 5px;
            color: white;
        }
        .btn-aprobar { background-color: #28a745; }
        .btn-rechazar { background-color: #ffc107; color: #333; }
        .btn-eliminar { background-color: #dc3545; }
    </style>
</head>
<body>

    <!-- MODAL DE LOGIN ADMIN -->
    <div id="loginModalContainer">
        <div class="login-card">
            <h2>Acceso Administrador</h2>
            <form id="loginForm">
                <input type="email" id="usuarioAdmin" placeholder="Correo de administrador" required>
                <input type="password" id="passwordAdmin" placeholder="Contraseña" required>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <a href="index.html"><i class="fas fa-arrow-left"></i> Volver a la página principal</a>
        </div>
    </div>

    <!-- CONTENIDO DEL PANEL DE ADMIN -->
    <div id="panelAdminContent" class="hidden">
        <header class="admin-header">
            <h1>Panel de Gestión - BrillaClean</h1>
            <button id="btnCerrarSesion" class="btn-logout">Cerrar Sesión</button>
        </header>

        <div class="admin-container">
            <h2>Órdenes de Servicios Recibidas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID Orden</th>
                            <th>Cliente / Teléfono</th>
                            <th>Servicio</th>
                            <th>Fecha / Dirección</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaOrdenesAdmin">
                        <!-- Las órdenes se cargarán automáticamente aquí mediante Firestore -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SDKs de Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <!-- Script del Panel Admin -->
    <script src="js/admin.js"></script>
</body>
</html>
