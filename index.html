<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Clean Corporation | Servicios de Limpieza</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            color: #333;
            margin: 20px;
            box-sizing: border-box;
        }
        h1, h2 {
            color: #1b4332;
            text-align: center;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1b4332;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2d6a4f;
        }
        .section-divider {
            margin: 30px 0 20px 0;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .resultado-estado {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background: #f1f3f5;
            font-size: 14px;
            display: none;
        }
        .codigo-copiar-box {
            background: #e8f5e9;
            border: 1px dashed #2e7d32;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .btn-copiar {
            background-color: #2e7d32;
            margin-top: 8px;
            padding: 8px;
            font-size: 14px;
        }
        .admin-link {
            text-align: center;
            margin-top: 15px;
        }
        .admin-link a {
            color: #fff;
            text-decoration: underline;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Nexus Clean Corporation</h1>
        <p style="text-align: center; color: #666; font-size: 14px;">Reserva tu servicio de limpieza profesional</p>

        <!-- Formulario de Reserva -->
        <form id="form-reserva" onsubmit="registrarReserva(event)">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" required placeholder="Ej. +56912345678">
            </div>
            <div class="form-group">
                <label for="servicio">Tipo de Servicio:</label>
                <select id="servicio">
                    <option value="Limpieza Residencial">Limpieza Residencial</option>
                    <option value="Limpieza de Oficinas">Limpieza de Oficinas</option>
                    <option value="Limpieza Profunda / Post-Obra">Limpieza Profunda / Post-Obra</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fecha">Fecha y Horario:</label>
                <input type="date" id="fecha" required style="margin-bottom: 8px;">
                <input type="text" id="horario" placeholder="Ej. Mañana (09:00 - 13:00)" required>
            </div>
            <button type="submit">Solicitar Reserva</button>
        </form>

        <!-- Caja para mostrar el código generado y botón de copiar -->
        <div id="box-codigo" class="codigo-copiar-box">
            <p style="margin: 0 0 5px 0; font-size: 13px; color: #2e7d32;"><b>¡Reserva enviada con éxito!</b> Guarda tu código:</p>
            <span id="texto-codigo" style="font-size: 18px; font-weight: bold; color: #1b4332;"></span>
            <button class="btn-copiar" onclick="copiarCodigo()">Copiar Código</button>
        </div>

        <!-- Apartado para Consultar el Estado de la Orden -->
        <div class="section-divider">
            <h2>Consultar Estado</h2>
            <div class="form-group">
                <label for="input-consulta">Ingresa tu Código de Orden:</label>
                <input type="text" id="input-consulta" placeholder="Ej. NX-123456">
            </div>
            <button type="button" onclick="consultarEstado()">Ver Estado</button>
            <div id="resultado-consulta" class="resultado-estado"></div>
        </div>
    </div>

    <div class="admin-link">
        <a href="admin.html">Acceso Administrador</a>
    </div>

    <script>
        let ultimoCodigoGenerado = "";

        function registrarReserva(e) {
            e.preventDefault();
            const nombre = document.getElementById("nombre").value.trim();
            const telefono = document.getElementById("telefono").value.trim();
            const servicio = document.getElementById("servicio").value;
            const fecha = document.getElementById("fecha").value;
            const horario = document.getElementById("horario").value.trim();

            const codigoUnico = "NX-" + Math.floor(100000 + Math.random() * 900000);
            const nuevaReserva = {
                id: 'reserva_' + Date.now(),
                codigo: codigoUnico,
                nombre,
                telefono,
                servicio,
                fecha,
                horario,
                estado: "pendiente"
            };

            let reservas = JSON.parse(localStorage.getItem("nexus_reservas")) || [];
            reservas.push(nuevaReserva);
            localStorage.setItem("nexus_reservas", JSON.stringify(reservas));

            ultimoCodigoGenerado = codigoUnico;
            document.getElementById("texto-codigo").innerText = codigoUnico;
            document.getElementById("box-codigo").style.display = "block";
            document.getElementById("form-reserva").reset();
            alert("¡Reserva registrada con éxito!");
        }

        function copiarCodigo() {
            if (!ultimoCodigoGenerado) return;
            navigator.clipboard.writeText(ultimoCodigoGenerado).then(() => {
                alert("¡Código copiado al portapapeles!");
            }).catch(err => {
                console.error("Error al copiar: ", err);
            });
        }

        function consultarEstado() {
            const codigoBuscado = document.getElementById("input-consulta").value.trim();
            const contenedorResultado = document.getElementById("resultado-consulta");

            if (!codigoBuscado) {
                alert("Por favor ingresa un código de orden.");
                return;
            }

            contenedorResultado.style.display = "block";
            contenedorResultado.innerHTML = "Buscando estado...";

            let reservas = JSON.parse(localStorage.getItem("nexus_reservas")) || [];
            const reservaEncontrada = reservas.find(r => r.codigo === codigoBuscado);

            if (!reservaEncontrada) {
                contenedorResultado.innerHTML = "❌ No se encontró ninguna reserva con ese código.";
                return;
            }

            let estadoTexto = "";
            let colorEstado = "";

            if (reservaEncontrada.estado === "pendiente") {
                estadoTexto = "⏳ Pendiente de revisión por el administrador";
                colorEstado = "#d9534f";
            } else if (reservaEncontrada.estado === "confirmada") {
                estadoTexto = "✅ ¡Aceptada y Confirmada!";
                colorEstado = "#28a745";
            } else if (reservaEncontrada.estado === "rechazada") {
                estadoTexto = "❌ Rechazada";
                colorEstado = "#6c757d";
            }

            contenedorResultado.innerHTML = `
                <b>Cliente:</b> ${reservaEncontrada.nombre}<br>
                <b>Servicio:</b> ${reservaEncontrada.servicio}<br>
                <b>Fecha:</b> ${reservaEncontrada.fecha} (${reservaEncontrada.horario})<br>
                <b>Estado Actual:</b> <span style="color: ${colorEstado}; font-weight: bold;">${estadoTexto}</span>
            `;
        }
    </script>
</body>
</html>
